name: WordPress Plugin Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 1: Build + PHP compatibility (run in parallel)

  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare plugin folder for CI
        run: |
          mkdir -p ci-build/chip-for-givewp
          git archive HEAD | tar -x -C ci-build/chip-for-givewp
          echo "✅ Plugin folder prepared"
          ls -la ci-build/chip-for-givewp/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: chip-for-givewp-build
          path: ci-build/
          retention-days: 5

  php-compatibility:
    name: PHP ${{ matrix.php-version }} Compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.2', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install PHPCompatibility
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev squizlabs/php_codesniffer dealerdirect/phpcodesniffer-composer-installer phpcompatibility/phpcompatibility-wp:"*"
          echo "$(composer global config bin-dir --absolute)" >> $GITHUB_PATH

      - name: Verify PHPCS Standards
        run: phpcs -i

      - name: Check PHP ${{ matrix.php-version }} Compatibility
        run: |
          phpcs --standard=PHPCompatibilityWP --runtime-set testVersion ${{ matrix.php-version }} --extensions=php --ignore=vendor,node_modules,assets .

  phpunit:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: phpunit

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: phpunit

  # Tier 2: PHPCS (depends on nothing, runs in parallel)

  phpcs:
    name: PHP CodeSniffer (WordPress Standards)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev squizlabs/php_codesniffer dealerdirect/phpcodesniffer-composer-installer wp-coding-standards/wpcs:"^3.0"
          echo "$(composer global config bin-dir --absolute)" >> $GITHUB_PATH

      - name: Verify PHPCS Standards
        run: phpcs -i

      - name: Run PHPCS
        run: phpcs --standard=phpcs.xml .
        continue-on-error: false

  # Tier 3: Plugin Check (needs build artifact)
  # Uses wordpress/plugin-check-action@v1.1.7, which fixes the wp-env
  # "Environment not initialized" bug from upstream issue #579
  # (closed via PR #590 — drops the URL-plugin bootstrap and installs
  # plugin-check via WP-CLI after wp-env start with a post-boot check).

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    needs: [build, php-compatibility, phpcs, phpunit]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: chip-for-givewp-build
          path: ./build

      # Setup PHP so the action can pick it up for wp-env's CLI container.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1.1.7
        with:
          build-dir: ./build/chip-for-givewp
          # Plugin name "CHIP for GiveWP" and slug "chip-for-givewp"
          # contain "wp" which is already published on WordPress.org
          # and cannot be changed, so trademarked_term is a known false positive.
          # NonPrefixedHooknameFound is unavoidable for a third-party
          # GiveWP gateway: we listen to GiveWP's give_* / givewp_* hooks
          # (add_action/add_filter), and until v2.0.0 we still fire two
          # legacy give_before_chip_info_fields / give_after_chip_info_fields
          # hooks kept for backward compatibility. See
          # includes/class-chip-givewp-purchase.php and
          # chip-for-givewp.php for the prefixed gwp_chip_* replacements
          # introduced in 1.4.0.
          # newline-separated per the action's input contract.
          ignore-codes: |
            trademarked_term
            WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedHooknameFound
